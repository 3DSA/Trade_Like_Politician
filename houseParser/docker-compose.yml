# Basic Postgres service for local development
# Start:  docker compose up -d
# Stop:   docker compose down
# Logs:   docker compose logs -f
services:
  postgres:
    image: postgres:16
    container_name: tlp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tlp
      POSTGRES_PASSWORD: tlp_password
      POSTGRES_DB: tlp_house
    ports:
      - "5432:5432"
    volumes:
      - ./db-data:/var/lib/postgresql/data
